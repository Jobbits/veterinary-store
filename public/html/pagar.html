<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Compra</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-5 text-center">Resumen de Compra</h1>
        <div class="row mt-4">
            <div class="col-md-8">
                <div class="card mb-3">
                    <div class="card-header bg-primary text-white">
                        Productos en el Carrito
                    </div>
                    <div class="card-body">
                        <ul class="list-group">
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                Alimento para Peces
                                <span class="badge bg-primary rounded-pill">$10.00</span>
                                <button type="button" class="btn-close" aria-label="Eliminar"></button>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                Juguete para Perro
                                <span class="badge bg-primary rounded-pill">$15.00</span>
                                <button type="button" class="btn-close" aria-label="Eliminar"></button>
                            </li>
                            <!-- Ejemplo de productos, añadir dinámicamente según el carrito -->
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-header bg-success text-white">
                        Detalles del Pago
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">Total a Pagar</h5>
                        <p class="card-text">$25.00</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Detalles del Pago</h5>
                        <form id="paymentForm" action="procesar_pago.php" method="POST">
                            <div class="mb-3">
                                <label for="nombre">Nombre en la Tarjeta</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="numeroTarjeta">Número de Tarjeta</label>
                                <input type="text" class="form-control" id="numeroTarjeta" name="numeroTarjeta" required>
                            </div>
                            <div class="mb-3">
                                <label for="fechaVencimiento">Fecha de Vencimiento</label>
                                <input type="text" class="form-control" id="fechaVencimiento" name="fechaVencimiento" placeholder="MM/AA" required>
                            </div>
                            <div class="mb-3">
                                <label for="cvv">CVV</label>
                                <input type="text" class="form-control" id="cvv" name="cvv" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg btn-block">Pagar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js" integrity="sha512-udHR0qMlA2hDr5rht5W72jYwPUk3oIA+D1FJd4pFnYLMOA4mCpif2sc27rPT3GtQtlp+9GfBrGZZs9Z7+dV4DQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <div class="modal fade" id="paymentSuccessModal" tabindex="-1" aria-labelledby="paymentSuccessModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="paymentSuccessModalLabel">¡Pago Exitoso!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Su pago ha sido procesado con éxito.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
